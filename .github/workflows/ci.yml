name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Python and ingress
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install audio build dependencies
        run: sudo apt-get update && sudo apt-get install --yes portaudio19-dev

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            acoustica/requirements.txt
            acoustica/constraints.txt
            acoustica/requirements-dev.txt

      - name: Install locked dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r acoustica/requirements-dev.txt

      - name: Run validation
        run: bash acoustica/validate.sh

      - name: Check dependency integrity
        run: python -m pip check

  addon-lint:
    name: Home Assistant app lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Run Home Assistant app linter
        uses: frenck/action-addon-linter@v2.21
        with:
          path: ./acoustica

  browser:
    name: Beginner browser flow
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Run the five-step wizard in headless Chrome
        shell: bash
        run: |
          cd acoustica
          python3 -m http.server 8765 > /tmp/acoustica-browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/tests/browser/easy_setup_harness.html > /dev/null; then
              break
            fi
            sleep 0.25
          done

          google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=10000 \
            --dump-dom \
            http://127.0.0.1:8765/tests/browser/easy_setup_harness.html \
            > /tmp/acoustica-browser-dom.html

          if ! grep -Fq 'data-status="passed"' /tmp/acoustica-browser-dom.html; then
            cat /tmp/acoustica-browser-dom.html
            cat /tmp/acoustica-browser-server.log
            exit 1
          fi

  build:
    name: Build ${{ matrix.arch }} image
    needs:
      - validate
      - addon-lint
      - browser
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
            build_from: ghcr.io/home-assistant/amd64-base:3.21
          - arch: aarch64
            os: ubuntu-24.04-arm
            build_from: ghcr.io/home-assistant/aarch64-base:3.21
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Read app version
        id: version
        shell: bash
        run: echo "value=$(awk -F '"' '/^version:/ {print $2}' acoustica/config.yaml)" >> "$GITHUB_OUTPUT"

      - name: Build Home Assistant image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          build-args: |
            BUILD_FROM=${{ matrix.build_from }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./acoustica
          cosign: "false"
          image: ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-acoustica-ci
          image-tags: ci
          push: "false"
          version: ${{ steps.version.outputs.value }}
