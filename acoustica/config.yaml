name: "Acoustica"
version: "10.4.0"
slug: "acoustica"
description: "Listen on a microphone and turn alarms/beeps (smoke, CO, appliances) into Home Assistant binary sensors"
url: "https://github.com/h0tp-ftw/acoustica"
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
startup: application
boot: auto
init: false
audio: true
homeassistant_api: true
discovery:
  - acoustica
# Web UI (the acoustic-engine tuner) exposed via HA Ingress as a sidebar panel.
ingress: true
ingress_port: 8099
panel_icon: mdi:sine-wave
panel_title: "Acoustica"
map:
  # Compatibility only: install the bundled integration and migrate legacy profiles.
  - config:rw
# Each detector becomes one binary_sensor. Give it a source:
#   preset:  a built-in pattern  (smoke_t3 | co_t4)
#   profile: a canonical YAML stored in add-on-owned /data/profiles
#   learn:   a WAV stored in add-on-owned /data/sounds
#            — the add-on turns it into a profile on first run.
# device_class controls the icon/semantics of the sensor in Home Assistant.
options:
  detectors:
    - name: "Smoke Alarm"
      preset: "smoke_t3"
      device_class: "smoke"
    - name: "CO Alarm"
      preset: "co_t4"
      device_class: "carbon_monoxide"
  sample_rate: 44100
  device_index: -1
  hold_seconds: 30
  debug: false
schema:
  detectors:
    - name: str
      preset: "list(smoke_t3|co_t4)?"
      profile: "str?"
      learn: "str?"
      device_class: "list(smoke|carbon_monoxide|gas|sound|moisture|safety|problem|running|vibration)?"
  sample_rate: int
  device_index: "int?"
  hold_seconds: int
  debug: bool
