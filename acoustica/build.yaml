# Base image per architecture. Without this the Supervisor passes an empty
# BUILD_FROM to the Dockerfile and the build fails with
#   base name ($BUILD_FROM) should not be blank
# Alpine base (matches the apk-based Dockerfile).
build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base:3.21
  amd64: ghcr.io/home-assistant/amd64-base:3.21
